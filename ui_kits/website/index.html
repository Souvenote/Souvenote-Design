<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Souvenote — Website UI Kit</title>
  <link rel="stylesheet" href="../../colors_and_type.css?v=20" />
  <link rel="stylesheet" href="site.css?v=20" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div class="souv-page-halo"></div>
  <div class="souv-sparkles"></div>
  <div class="souv-gems">
    <span class="souv-gem g1"></span>
    <span class="souv-gem is-rose g2"></span>
    <span class="souv-gem is-silver g3"></span>
    <span class="souv-gem g4"></span>
    <span class="souv-gem is-rose g5"></span>
    <span class="souv-gem is-silver g6"></span>
    <span class="souv-gem g7"></span>
    <span class="souv-gem is-silver g8"></span>
  </div>
  <div class="souv-grain"></div>

  <div id="root"></div>

  <!-- Floating page-state switcher -->
  <div class="souv-state-toggle">
    <span>View</span>
    <a href="index.html" class="is-active">Logged Out</a>
    <a href="index-loggedin.html">Logged In</a>
  </div>

  <!-- Tweaks panel (hidden until toolbar toggles it) -->
  <aside id="tweaks" class="tweaks-panel" aria-label="Tweaks">
    <div class="tweaks-title">Tweaks</div>
    <div class="tweaks-row">
      <span class="tweaks-label">Hero accent</span>
      <div class="tweaks-seg" id="tw-accent">
        <button data-v="gold" class="is-active">Gold</button>
        <button data-v="silver">Silver</button>
        <button data-v="rose">Rose</button>
      </div>
    </div>
  </aside>

  <script type="text/babel">
    // ============================================================
    // Ornaments.jsx — shared primitives
    // ============================================================
    function OrnamentDivider({ className = '' }) {
      return (
        <div className={`souv-orn ${className}`}>
          <span className="r" /><span className="d" /><span className="r" />
        </div>
      );
    }

    function RuleGold({ style }) {
      return <div className="souv-rule-gold" style={style} />;
    }

    function StampCorners({ color = 'rgba(212,175,55,0.55)' }) {
      const base = {
        position: 'absolute', width: 28, height: 28, borderColor: color,
        pointerEvents: 'none',
      };
      return (
        <>
          <span style={{ ...base, top: 12, left: 12, borderTop: '2px solid', borderLeft: '2px solid' }} />
          <span style={{ ...base, top: 12, right: 12, borderTop: '2px solid', borderRight: '2px solid' }} />
          <span style={{ ...base, bottom: 12, left: 12, borderBottom: '2px solid', borderLeft: '2px solid' }} />
          <span style={{ ...base, bottom: 12, right: 12, borderBottom: '2px solid', borderRight: '2px solid' }} />
        </>
      );
    }

    function Eyebrow({ children, style }) {
      return <div className="souv-eyebrow" style={style}>{children}</div>;
    }

    // ============================================================
    // Navbar.jsx
    // ============================================================
    const NAV_LINKS = [
      { label: 'Personalize a Template', sub: 'Curated designs, ready to make yours.' },
      { label: 'Build My Card',          sub: 'Start from scratch — photo, moment, song.' },
      { label: 'Community Cards',        sub: 'Cards shared by the Souvenote community.' },
      { label: 'Gifts',                  sub: 'Handpicked cards paired with a keepsake.' },
      { label: 'Business',               sub: 'Bulk, branded, and corporate gifting.' },
    ];

    function IconImage() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
          <rect x="3" y="4.5" width="18" height="15" rx="2" />
          <circle cx="9" cy="10" r="1.6" />
          <path d="M3.5 17 L9 12 L13 15.5 L17 11 L20.5 14.5" />
        </svg>
      );
    }
    function IconNote() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
          <path d="M9 17V5l11-2v12" />
          <circle cx="6.5" cy="17.5" r="2.5" fill="currentColor" stroke="none" />
          <circle cx="17.5" cy="15.5" r="2.5" fill="currentColor" stroke="none" />
        </svg>
      );
    }
    function IconUser() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" />
        </svg>
      );
    }
    function IconCart() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 5h2.4l2.3 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 1.96-1.6L21 9H6" />
          <circle cx="10" cy="21" r="1.4" />
          <circle cx="17" cy="21" r="1.4" />
        </svg>
      );
    }
    function IconMenu() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      );
    }

    function CreditsTicker({ images = 0, songs = 0 }) {
      return (
        <div className="souv-credits souv-credits-stack" title="Your credits">
          <span className="souv-credit"><IconImage /><b>{images}</b><em>Images</em></span>
          <span className="souv-credit"><IconNote /><b>{songs}</b><em>Songs</em></span>
        </div>
      );
    }

    function NavRight({ loggedIn, user, credits, cartCount, profileOpen, setProfileOpen, menuOpen, setMenuOpen }) {
      if (!loggedIn) {
        return (
          <div className="souv-nav-right">
            <button className="souv-cta-flow"><span>Get Started</span></button>
          </div>
        );
      }
      return (
        <div className="souv-nav-right">
          <CreditsTicker images={credits.images} songs={credits.songs} />
          <span className="souv-nav-sep" />
          <div className="souv-iconbtn-wrap">
            <button
              className={`souv-iconbtn ${profileOpen ? 'is-open' : ''}`}
              onClick={() => { setProfileOpen(!profileOpen); setMenuOpen(false); }}
              aria-label="Account"
            ><IconUser /></button>
            {profileOpen && (
              <>
                <div className="souv-overlay" onClick={() => setProfileOpen(false)} />
                <div className="souv-popmenu souv-popmenu-wide">
                  <div className="souv-popmenu-userhead">
                    <div className="souv-popmenu-avatar">{user.initials}</div>
                    <div>
                      <div className="souv-popmenu-name">{user.name}</div>
                      <div className="souv-popmenu-email">{user.email}</div>
                    </div>
                  </div>
                  <div className="souv-popmenu-sep" />
                  <div className="souv-popmenu-item">My Cards</div>
                  <div className="souv-popmenu-item">Drafts</div>
                  <div className="souv-popmenu-item">Orders & Shipping</div>
                  <div className="souv-popmenu-item">Saved Templates</div>
                  <div className="souv-popmenu-sep" />
                  <div className="souv-popmenu-item">Account Settings</div>
                  <div className="souv-popmenu-item">Buy More Credits</div>
                  <div className="souv-popmenu-sep" />
                  <div className="souv-popmenu-logout">Sign Out</div>
                </div>
              </>
            )}
          </div>
          <div className="souv-iconbtn-wrap">
            <button className="souv-iconbtn" aria-label="Cart">
              <IconCart />
              {cartCount > 0 && <span className="souv-cart-badge">{cartCount}</span>}
            </button>
          </div>
          <div className="souv-iconbtn-wrap">
            <button
              className={`souv-iconbtn ${menuOpen ? 'is-open' : ''}`}
              onClick={() => { setMenuOpen(!menuOpen); setProfileOpen(false); }}
              aria-label="Menu"
            ><IconMenu /></button>
            {menuOpen && (
              <>
                <div className="souv-overlay" onClick={() => setMenuOpen(false)} />
                <div className="souv-popmenu">
                  <div className="souv-popmenu-item">Notifications</div>
                  <div className="souv-popmenu-item">Help & Support</div>
                  <div className="souv-popmenu-item">Refer a Friend</div>
                  <div className="souv-popmenu-item">What's New</div>
                  <div className="souv-popmenu-sep" />
                  <div className="souv-popmenu-item">Business Tools</div>
                  <div className="souv-popmenu-item">Gift Bundles</div>
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    function Navbar({
      loggedIn = false,
      user = { name: 'Amelia Hart', email: 'amelia@souvenote.com', initials: 'AH' },
      credits = { images: 0, songs: 0 },
      cartCount = 0,
    }) {
      const [hovered, setHovered] = React.useState(null);
      const [menuOpen, setMenuOpen] = React.useState(false);
      const [profileOpen, setProfileOpen] = React.useState(false);

      return (
        <header className={`souv-nav ${loggedIn ? 'is-loggedin' : ''}`}>
          <div className="souv-nav-logo">
            <img src={loggedIn ? "../../assets/hero-logo.png" : "../../assets/SecondaryLogo.png"} alt="Souvenote" />
          </div>
          <nav className="souv-nav-links">
            {NAV_LINKS.map((link, i) => (
              <React.Fragment key={link.label}>
                {i > 0 && <span className="souv-nav-dot">·</span>}
                <div
                  className="souv-nav-link-wrap"
                  onMouseEnter={() => setHovered(link.label)}
                  onMouseLeave={() => setHovered(null)}
                >
                  <span className={`souv-nav-link ${hovered === link.label ? 'is-hover' : ''}`}>
                    {link.label}
                    <span className="souv-nav-underline" />
                  </span>
                  {hovered === link.label && (
                    <div className="souv-nav-popover">
                      <div className="souv-nav-popover-arrow" />
                      <RuleGold />
                      <div className="souv-nav-popover-body">
                        <div className="souv-nav-popover-title">{link.label}</div>
                        <div className="souv-nav-popover-rule" />
                        <div className="souv-nav-popover-sub">{link.sub}</div>
                      </div>
                    </div>
                  )}
                </div>
              </React.Fragment>
            ))}
          </nav>
          <NavRight
            loggedIn={loggedIn}
            user={user}
            credits={credits}
            cartCount={cartCount}
            profileOpen={profileOpen}
            setProfileOpen={setProfileOpen}
            menuOpen={menuOpen}
            setMenuOpen={setMenuOpen}
          />
        </header>
      );
    }

    // ============================================================
    // Hero.jsx
    // ============================================================
    function MusicPreviewButton({ label = 'Preview song' }) {
      const [playing, setPlaying] = React.useState(false);
      return (
        <button
          type="button"
          className={`souv-music-fab ${playing ? 'is-playing' : ''}`}
          onClick={(e) => { e.stopPropagation(); setPlaying(p => !p); }}
          aria-label={playing ? 'Pause song' : label}
        >
          {playing ? (
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <rect x="6" y="5" width="4" height="14" rx="1" />
              <rect x="14" y="5" width="4" height="14" rx="1" />
            </svg>
          ) : (
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M9 17V5l11-2v12" stroke="currentColor" strokeWidth="1.6" fill="none" strokeLinecap="round" strokeLinejoin="round" />
              <circle cx="6" cy="17" r="2.4" />
              <circle cx="17" cy="15" r="2.4" />
            </svg>
          )}
        </button>
      );
    }

    function HeroFlipCard() {
      return (
        <div className="souv-flipcard souv-flipcard-spin">
          <div className="souv-flipcard-inner">
            <div className="souv-flipcard-face souv-flipcard-front">
              <div className="souv-flipcard-back-stack">
                <div className="souv-flipcard-mainlogo-wrap">
                  <img src="../../assets/MainLogo.png" alt="Souvenote" />
                </div>
              </div>
              <MusicPreviewButton label="Preview Souvenote theme" />
            </div>
            <div className="souv-flipcard-face souv-flipcard-back souv-flipcard-art-face">
              <img src="../../assets/hero-card-moon.jpg" alt="I love you to the moon and back" className="souv-flipcard-art" />
              <MusicPreviewButton label="Preview card song" />
            </div>
          </div>
        </div>
      );
    }

    function Hero({ accentMetal = 'gold' }) {
      const accentClass = {
        gold:   'text-metallic-gold',
        silver: 'text-metallic-silver',
        rose:   'text-metallic-rose-gold',
      }[accentMetal];

      return (
        <section className="souv-hero">
          <div className="souv-hero-halo souv-hero-halo-1" />
          <div className="souv-hero-halo souv-hero-halo-2" />
          <div className="souv-hero-inner">
            <div className="souv-hero-copy">
              <h1 className="souv-hero-title">
                <span className="souv-hero-italic text-metallic-silver">A card</span>{' '}
                <span className={`souv-hero-italic ${accentClass}`} style={accentMetal === 'gold' ? { textShadow: '0 0 20px rgba(241,208,116,.42), 0 0 40px rgba(212,175,55,.2)' } : undefined}>worth</span>{' '}
                <span className="souv-hero-italic text-metallic-rose-gold">keeping</span>
              </h1>
              <div className="souv-hero-ctas">
                <button className="souv-btn-colorful"><span>Start for Free ↗</span></button>
                <button className="souv-btn-log">Log In</button>
              </div>
              <p className="souv-hero-lede">
                Generate personalized cards and custom songs. Because the card you send should be as unique as they are.
              </p>
              <p className="souv-hero-trial">Includes 1 free image generation and 1 free song</p>
            </div>
            <div className="souv-hero-stack">
              <HeroFlipCard />
            </div>
          </div>
        </section>
      );
    }

    // ============================================================
    // HowItWorks.jsx
    // ============================================================
    const STEPS = [
      { n: '01', t: 'Choose a moment',       d: 'Pick the occasion and tell us who it\'s for. Or upload a photo that tells the story for you.' },
      { n: '02', t: 'Let AI craft the card',  d: 'Souvenote writes the words, designs the face, and composes a song — tailored to your moment.' },
      { n: '03', t: 'Print, send, keep',      d: 'Order the physical card for $11.99 CAD. Share the digital version — or save it to your library.' },
    ];

    function HowItWorks() {
      return (
        <section className="souv-steps">
          <div className="souv-steps-head">
            <Eyebrow>How it works</Eyebrow>
            <h2 className="souv-h1">
              <span className="souv-hero-italic text-metallic-silver">Three steps,</span>{' '}
              <span className="souv-hero-italic text-metallic-rose-gold">one keepsake.</span>
            </h2>
          </div>
          <div className="souv-steps-grid">
            {STEPS.map(s => (
              <div key={s.n} className="souv-step-card">
                <StampCorners />
                <div className="souv-step-num">{s.n}</div>
                <div className="souv-step-title">{s.t}</div>
                <div className="souv-step-body">{s.d}</div>
              </div>
            ))}
          </div>
          <OrnamentDivider />
        </section>
      );
    }

    // ============================================================
    // Gallery.jsx
    // ============================================================
    const TEMPLATES = [
      { id: 1, name: 'A Daily Sunday Strip',   occasion: 'Comic Strip',   surface: 'surface-gold-animated' },
      { id: 2, name: 'Stars Aligned For You',  occasion: 'Horoscope',     surface: 'surface-rosegold-animated' },
      { id: 3, name: 'A Day In History',       occasion: 'On This Day',   surface: 'surface-silver-animated' },
      { id: 4, name: 'Once Upon A Card',       occasion: 'Fairy Tale',    surface: 'surface-rosegold-animated' },
      { id: 5, name: 'Find The Birthday',      occasion: "Where's Waldo", surface: 'surface-trimetal-animated' },
      { id: 6, name: 'Cards For The Strange',  occasion: 'Dark Holidays', surface: 'surface-silver-animated' },
    ];

    function Gallery() {
      const [i, setI] = React.useState(0);
      const trackRef = React.useRef(null);

      React.useEffect(() => {
        if (!trackRef.current) return;
        const el = trackRef.current.children[i];
        if (el) el.scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
      }, [i]);

      return (
        <section className="souv-gallery">
          <div className="souv-gallery-head">
            <div className="souv-gallery-rail">
              <div className="souv-gallery-rail-line" />
              <Eyebrow>Gallery</Eyebrow>
              <h2 className="souv-h1">
                <span className="souv-hero-italic text-metallic-silver">Explore the</span>{' '}
                <span className="souv-hero-italic text-metallic-rose-gold">possibilities</span>
              </h2>
              <p className="souv-gallery-sub">Hover any card to see it spin — every drop is a fresh occasion.</p>
              <div className="souv-gallery-controls">
                <button className="souv-chev" onClick={() => setI(Math.max(0, i - 1))} aria-label="Previous">‹</button>
                <button className="souv-chev" onClick={() => setI(Math.min(TEMPLATES.length - 1, i + 1))} aria-label="Next">›</button>
              </div>
            </div>
            <div className="souv-gallery-track-wrap">
              <div ref={trackRef} className="souv-gallery-track">
                {TEMPLATES.map((c, idx) => (
                  <div key={c.id} className={`souv-gallery-card ${idx === i ? 'is-active' : ''}`}>
                    <div className="souv-gallery-flip">
                      <div className="souv-gallery-flip-inner">
                        <div className={`souv-gallery-surface souv-gallery-flip-face souv-gallery-flip-front ${c.surface}`}>
                          <StampCorners />
                          <div className="souv-gallery-surface-center">
                            <div className="souv-gallery-occasion">{c.occasion}</div>
                          </div>
                          <MusicPreviewButton label={`Preview ${c.name} song`} />
                        </div>
                        <div className={`souv-gallery-surface souv-gallery-flip-face souv-gallery-flip-back ${c.surface}`}>
                          <StampCorners />
                          <div className="souv-gallery-surface-center">
                            <div className="souv-gallery-occasion">{c.occasion}</div>
                          </div>
                          <MusicPreviewButton label={`Preview ${c.name} song`} />
                        </div>
                      </div>
                    </div>
                    <div className="souv-gallery-meta">
                      <div className="souv-gallery-name">{c.name}</div>
                      <div className="souv-gallery-price">From $11.99 CAD</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    }

    // ============================================================
    // FAQ.jsx
    // ============================================================
    const FAQ_ITEMS = [
      { q: 'How does the free trial work?',
        a: 'You get 1 free image generation and 1 free song when you sign up. No credit card required. If you love your card, you can purchase it and we’ll print and mail it.' },
      { q: 'What does a personalized song sound like?',
        a: 'Each song is uniquely generated based on details you provide. Previews are available in the carousel above — hit play to hear examples.' },
      { q: 'How long does shipping take?',
        a: 'Cards typically arrive within 5–7 business days within Canada. International shipping times vary by destination.' },
      { q: 'Can I save my card and finish later?',
        a: 'Yes — all designs are automatically saved in My Cards & Songs for 30 days. Return anytime to finish and purchase.' },
      { q: 'What payment methods do you accept?',
        a: 'We accept all major credit cards, Apple Pay, and Google Pay. All prices are in CAD.' },
    ];

    function FAQ() {
      const [open, setOpen] = React.useState(0);
      return (
        <section className="souv-faq">
          <div className="souv-faq-head">
            <Eyebrow>Questions</Eyebrow>
            <h2 className="souv-h1">
              <span className="souv-hero-italic text-metallic-silver">Frequently Asked</span>{' '}
              <span className="souv-hero-italic text-metallic-rose-gold">Questions</span>
            </h2>
          </div>
          <div className="souv-faq-list">
            {FAQ_ITEMS.map((item, idx) => {
              const isOpen = open === idx;
              return (
                <div key={item.q} className={`souv-faq-item ${isOpen ? 'is-open' : ''}`}>
                  <button className="souv-faq-q" onClick={() => setOpen(isOpen ? -1 : idx)}>
                    <span>{item.q}</span>
                    <div className="souv-faq-pm"><b /><b className={isOpen ? 'hidden' : 'v'} /></div>
                  </button>
                  <div className={`souv-faq-a ${isOpen ? 'is-open' : ''}`}>
                    <p>{item.a}</p>
                  </div>
                </div>
              );
            })}
          </div>
        </section>
      );
    }

    // ============================================================
    // Footer.jsx
    // ============================================================
    const SOCIAL = [
      { label: 'Instagram', path: 'M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2zm0 1.5A4.25 4.25 0 0 0 3.5 7.75v8.5A4.25 4.25 0 0 0 7.75 20.5h8.5A4.25 4.25 0 0 0 20.5 16.25v-8.5A4.25 4.25 0 0 0 16.25 3.5zm4.25 3a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11zm0 1.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm5.75-.88a1.13 1.13 0 1 1-2.25 0 1.13 1.13 0 0 1 2.25 0z' },
      { label: 'TikTok',    path: 'M16.6 5.82A4.28 4.28 0 0 1 13.8 3h-3v12.4a2.6 2.6 0 0 1-2.6 2.6 2.6 2.6 0 0 1-2.6-2.6A2.6 2.6 0 0 1 8.2 12.8c.28 0 .56.04.82.12V9.84A5.59 5.59 0 0 0 8.2 9.6 5.6 5.6 0 0 0 2.6 15.2a5.6 5.6 0 0 0 5.6 5.6 5.6 5.6 0 0 0 5.6-5.6V9.74a7.28 7.28 0 0 0 4.2 1.34V8.08a4.28 4.28 0 0 1-1.4-2.26z' },

    const FOOTER_COLS = [
      { title: 'Create',  items: ['Build My Card', 'Personalize a Template', 'Community Cards', 'Songs & Images'] },
      { title: 'Explore', items: ['Gifts', 'Business', 'Pricing', 'Gallery'] },
      { title: 'Account', items: ['Library', 'My Cards & Songs', 'Sign In', 'Sign Up'] },
      { title: 'Company', items: ['About', 'Contact', 'Terms of Service', 'Privacy Policy'] },

    function Footer() {
      return (
        <footer className="souv-footer">
          <OrnamentDivider />
          <div className="souv-footer-inner">

                    {col.items.map(item => <li key={item}><a href="#" className="souv-footer-link">{item}</a></li>)}

          </div>

    // ============================================================
    // App + tweaks wiring
    // ============================================================
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accentMetal": "silver"
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);

      React.useEffect(() => {
        function handler(e) {
          if (e.data?.type === '__activate_edit_mode')   document.getElementById('tweaks').classList.add('is-open');
          if (e.data?.type === '__deactivate_edit_mode') document.getElementById('tweaks').classList.remove('is-open');
        }
        window.addEventListener('message', handler);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');

        const accent = document.getElementById('tw-accent');
        function wire(el, key) {
          el.addEventListener('click', (ev) => {
            const btn = ev.target.closest('button'); if (!btn) return;
            [...el.children].forEach(b => b.classList.toggle('is-active', b === btn));
            const v = btn.dataset.v;
            setTweaks(t => {
              const nt = { ...t, [key]: v };
              window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: v } }, '*');
              return nt;
            });
          });
        }
        wire(accent, 'accentMetal');
        return () => window.removeEventListener('message', handler);
      }, []);

      return (
        <>
          <Navbar />
          <Hero accentMetal={tweaks.accentMetal} />
          <HowItWorks />
          <Gallery />
          <FAQ />
          <Footer />
        </>
      );
    }

    function mountApp() {
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }
    if (document.readyState === 'complete') mountApp();
    else window.addEventListener('load', mountApp);
  </script>
